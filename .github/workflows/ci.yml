name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.9.0', '24.19.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Host peer dependencies are supplied by DSH; match the lockfile's install mode.
      - run: npm ci --legacy-peer-deps --ignore-scripts
      # The host's public declarations reference these peer packages. Supply them
      # only in the isolated check environment, without changing the release lock.
      - name: Install host declaration dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps @deepseek-ai/dsh-session-projection@0.2.2-rc.1 @deepseek-ai/dsh-package-manifest@0.2.2-rc.1
      - run: npm run check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          head: HEAD
          version: 3.96.0
          extra_args: --results=verified,unknown
